# 백엔드 연결 풀 - keepalive로 app 컨테이너와 연결 재사용
upstream app_backend {
    server app:3000;    # 실제 백엔드 = app 컨테이너의 3000 (compose 내부 DNS가 'app' 해석)
    keepalive 32;       # 이 백엔드와 재사용할 유휴 연결 최대 32개
}

server {
    listen 80;
    server_name _;
    server_tokens off;          # 서버 버전 노출 차단 ( 버전 기반 정찰 방어 )

    # 보안 응답 헤더 (always = 에러 응답에도 적용)
    add_header X-Frame-Options "DENY" always;           # 클릭재킹 방어 (iframe injection 방어)
    add_header X-Content-Type-Options "nosniff" always; # MIME 스니핑 XSS 방어 (text 응답을 스크립트로 실행하는 공격 차단)
    add_header Referrer-Policy "no-referrer" always;    # Referer 유출 방어 (URL 내 토큰·경로가 외부로 새는 것 차단)

    location / {
        proxy_pass http://app_backend;
        proxy_http_version 1.1;                                      # keepalive(연결 재사용)는 HTTP/1.1부터 동작 (기본 1.0은 안 됨)
        proxy_set_header Connection "";                              # 기본 Connection: close 제거 → 연결 유지(keepalive)
        proxy_set_header Host $host;                                 # 사용자가 요청한 원래 도메인을 app에 전달
        proxy_set_header X-Real-IP $remote_addr;                     # 접속한 실제 사용자 IP를 app에 전달
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; # 실제 사용자 IP 누적 전달 (trust proxy·rate limit이 이 값으로 IP 식별)
        proxy_set_header X-Forwarded-Proto $scheme;                  # 원래 요청이 http인지 https인지 app에 전달
    }
}