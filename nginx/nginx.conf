# 백엔드 연결 풀 - keepalive로 app 컨테이너와 연결 재사용
upstream app_backend {
    server app:3000;
    keepalive 32;       # 유지할 유휴 연결 수
}

server {
    listen 80;
    server_name _;
    server_tokens off;          # 서버 버전 노출 차단 ( 버전 기반 정찰 방어 )

    # 보안 응답 헤더 (always = 에러 응답에도 적용)
    add_header X-Frame-Options "DENY" always;           # 클릭재킹 방어 (iframe injection 방어)
    add_header X-Content-Type-Options "nosniff" always; # MIME 스니핑 XSS 방어 (text 응답을 스크립트로 실행하는 공격 차단)
    add_header Referrer-Policy "no-referrer" always;    # Referer 유출 방어 (URL 내 토큰·경로가 외부로 새는 것 차단)

    location / {
        proxy_pass http://app_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection ""; # keepalive 위해 Connection 비움 (기본 close 방지)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}